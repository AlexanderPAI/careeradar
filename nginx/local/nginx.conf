events {}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream frontend {
        server frontend:8501;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 25m;

        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location ~ ^/v1/(cv_analyzer/send_cv|searcher/chat|filter/check)$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_send_timeout 1200s;
            proxy_read_timeout 1200s;
        }

        location ~ ^/v1/(resume_advisor/recommendations|vacancy_match/analyze)$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /v1/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
