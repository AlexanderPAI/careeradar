services:

  nginx:
    image: nginx:alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env before production deployment}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_challenges:/var/www/certbot:ro
      - ${LETSENCRYPT_DIR:-./nginx/prod/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - public
      - frontend_backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend/storage:/app/backend/storage:rw
      - ./backend/certs:/run/careeradar/certs:ro
    env_file:
      - .env
    environment:
      APP_ENV: production
      POSTGRES_HOST: db
      GIGACHAT_VERIFY_SSL_CERTS: "true"
      GIGACHAT_ROOT_CA_FILE: /run/careeradar/certs/russian_trusted_root_ca.pem
      GIGACHAT_SUB_CA_FILE: /run/careeradar/certs/russian_trusted_sub_ca.pem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Add a random POSTGRES_PASSWORD to .env}
      JWT_SECRET: ${JWT_SECRET:?Add a random JWT_SECRET with at least 48 characters to .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      MALWARE_SCANNER_HOST: clamav
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - public
      - frontend_backend
      - backend_db
      - malware_scanner

  clamav:
    image: clamav/clamav-debian:1.5.3
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav:rw
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - malware_scanner

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Add a random POSTGRES_PASSWORD to .env}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend_db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    networks:
      - frontend_backend

volumes:
  postgres_data:
  certbot_challenges:
  clamav_signatures:

networks:
  public:
  frontend_backend:
    internal: true
  backend_db:
    internal: true
  malware_scanner:
